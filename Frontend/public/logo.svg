<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="collabXGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="collabXAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e40af" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Bracket { -->
  <path
    d="M 37 20 C 27 20, 20 28, 20 40 C 20 48, 14 50, 9 52 C 14 54, 20 56, 20 64 C 20 76, 27 84, 37 84"
    stroke="url(#collabXGrad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#logoShadow)"
  />

  <!-- Right Bracket } -->
  <path
    d="M 67 20 C 77 20, 84 28, 84 40 C 84 48, 90 50, 95 52 C 90 54, 84 56, 84 64 C 84 76, 77 84, 67 84"
    stroke="url(#collabXGrad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#logoShadow)"
  />

  <!-- Center X (Interlocking strokes) -->
  <path
    d="M 36 32 L 68 72"
    stroke="url(#collabXAccent)"
    stroke-width="7.5"
    stroke-linecap="round"
    filter="url(#logoShadow)"
  />
  <path
    d="M 68 32 L 56.5 46.5"
    stroke="url(#collabXAccent)"
    stroke-width="7.5"
    stroke-linecap="round"
    filter="url(#logoShadow)"
  />
  <path
    d="M 47.5 57.5 L 36 72"
    stroke="url(#collabXAccent)"
    stroke-width="7.5"
    stroke-linecap="round"
    filter="url(#logoShadow)"
  />
</svg>
